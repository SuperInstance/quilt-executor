[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quilt-executor"
version = "0.3.0"
description = "Universal executor for LLM fleets — providers, adaptive deciders, evaluators, memory; receipts over self-report"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
laya = ["laya4quilt>=0.3.20"]
cuopt = ["cuopt-server-cu12>=26.10"]
fast = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
quilt-executor-web = "executor.web:main"

[tool.setuptools]
packages = ["executor", "router", "deciders", "arena_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
